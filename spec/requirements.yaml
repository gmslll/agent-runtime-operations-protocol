  - id: IR-05
    statement_original_zh: 所有新调用先经 Control Plane 鉴权并创建 Run；可信服务拿 Dispatch Ticket 后可 Direct；浏览器 v1 走 BFF/Proxy。
    translation_en: Every new call must first pass Control Plane authentication and create a Run; trusted services may use Direct after obtaining a Dispatch Ticket; browsers use BFF/Proxy in v1.
    artifacts:

schema_version: 1
updated: 2026-09-22
source: epic-immutable-requirements
external_evidence_gate: "Never fake external partner/independent implementation conditions as complete."
immutability_rule: >-
  本文件中的 statement 是实施期不可静默改写的原始要求。若用户后续明确变更，
  必须新增变更记录、更新 Decision 和所有受影响映射，不得直接覆盖历史。


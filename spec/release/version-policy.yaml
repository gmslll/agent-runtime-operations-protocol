schema_version: 1
logical_pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-rc\.([1-9][0-9]*))?$'
mappings:
  go:
    prefix: v
    rc_separator: '-rc.'
  python:
    prefix: ''
    rc_separator: rc
  npm:
    prefix: ''
    rc_separator: '-rc.'
  oci:
    prefix: ''
    rc_separator: '-rc.'
  cli:
    prefix: ''
    rc_separator: '-rc.'
  schema_bundle:
    prefix: ''
    rc_separator: '-rc.'
immutable_order:
  - go
  - python
  - npm
  - oci
  - cli
  - schema_bundle
mutable_channel: stable

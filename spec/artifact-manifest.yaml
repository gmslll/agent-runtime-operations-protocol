schema_version: 1
catalog_id: arop-artifact-catalog-v1
updated: 2026-09-23
purpose: AROP 唯一机器可读的当前与规划制品目录。面向人的目录树不得 被解释为第二份制品清单。
authority_chain:
  - rank: 1
    role: decision_constraints
    sources:
      - decisions
    rule: 已确认 Decision 约束所有规范、Schema、传输绑定和实现。
  - rank: 2
    role: behavioral_authority
    sources:
      - protocol-specification
      - registry-specification
      - run-streaming-specification
      - base-state-machine-fixtures
    rule: 领域规范与状态机 Fixture 共同定义可观测行为。
  - rank: 3
    role: structural_authority
    sources:
      - schema-bundle
    rule: JSON Schema 定义结构、必填性、格式和枚举。
  - rank: 4
    role: transport_binding
    sources:
      - openapi-bundle
      - asyncapi-bundle
    rule: OpenAPI 和 AsyncAPI 只定义传输绑定，不重新定义数据语义。
  - rank: 5
    role: derived_non_authoritative
    sources:
      - generated-models
      - sdk-bundle
      - reference-control-plane
      - conformance-reports
    rule: 生成物、SDK、参考实现和报告均非规范权威。
statuses:
  present: 路径当前必须存在。
  planned: 已规划职责和路径、仍待 P04 批准或后续实现；不可宣称已交付。

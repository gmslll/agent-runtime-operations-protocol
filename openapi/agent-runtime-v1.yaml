openapi: 3.1.0
info:
  title: AROP Agent Runtime API v1
  version: 1.0.0
  description: >-
    Non-streaming provider runtime API for a single Control Plane-authorized
    Attempt. Event streaming is deliberately absent until P22.
servers:
  - url: https://runtime.example.invalid
paths:
  /health/live:
    get:
      operationId: agentRuntimeLiveness
      security: []
      responses:
        '204': {description: Process is live.}
  /health/ready:
    get:
      operationId: agentRuntimeReadiness
      security: []
      responses:
        '204': {description: Durable provider dependencies are ready.}
        '503': {$ref: '#/components/responses/Error503'}
  /v1/runs:
    post:
      operationId: acceptAuthorizedRunAttempt
      security:
        - RunBearer: []
      x-arop-required-scopes: [agent:invoke]
      x-arop-token-bindings:
        - run_id
        - attempt_id
        - agent_id
        - agent_version
        - skill_id
        - deployment_id
        - instance_id
        - generation
        - fencing_token
        - endpoint
        - audience
        - expiry
      parameters:
        - $ref: '#/components/parameters/AttemptIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/runtime/run-request-v1.schema.json'
      responses:
        '202':
          description: Attempt durably accepted or idempotently replayed.
          headers:
            Location:
              required: true
              schema: {type: string, pattern: '^/v1/runs/run_[0-9a-f-]+$'}
            Cache-Control:
              required: true
              schema: {const: no-store}
          content:
            application/json:
              schema:
                $ref: '../schemas/runtime/run-status-v1.schema.json'
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '409': {$ref: '#/components/responses/Error409'}
        '413': {$ref: '#/components/responses/Error413'}
        '415': {$ref: '#/components/responses/Error415'}
        '503': {$ref: '#/components/responses/Error503'}
  /v1/runs/{run_id}:
    get:
      operationId: getProviderRunStatus
      security:
        - RunBearer: []
      x-arop-required-scopes: [agent:invoke]
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Current durable provider status for the token-bound Attempt.
          headers:
            Cache-Control:
              required: true
              schema: {const: no-store}
          content:
            application/json:
              schema:
                $ref: '../schemas/runtime/run-status-v1.schema.json'
        '401': {$ref: '#/components/responses/Error401'}
        '404': {$ref: '#/components/responses/Error404'}
        '503': {$ref: '#/components/responses/Error503'}
  /v1/runs/{run_id}/commands:
    post:
      operationId: commandProviderRun
      security:
        - RunBearer: []
      x-arop-required-scopes: [agent:invoke]
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/runtime/command-v1.schema.json'
      responses:
        '202':
          description: Command durably accepted or idempotently replayed.
          headers:
            Cache-Control:
              required: true
              schema: {const: no-store}
          content:
            application/json:
              schema:
                $ref: '../schemas/runtime/run-status-v1.schema.json'
        '400': {$ref: '#/components/responses/Error400'}
        '401': {$ref: '#/components/responses/Error401'}
        '404': {$ref: '#/components/responses/Error404'}
        '409': {$ref: '#/components/responses/Error409'}
        '413': {$ref: '#/components/responses/Error413'}
        '415': {$ref: '#/components/responses/Error415'}
        '503': {$ref: '#/components/responses/Error503'}
components:
  securitySchemes:
    RunBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        $ref: '../schemas/common/identifiers.schema.json#/$defs/runId'
    AttemptIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Must equal the token-bound attempt_id.
      schema:
        $ref: '../schemas/common/identifiers.schema.json#/$defs/attemptId'
  schemas:
    AROPError:
      $ref: '../schemas/common/error.schema.json'
  responses:
    Error400:
      description: Invalid request.
      content: {application/json: {schema: {$ref: '#/components/schemas/AROPError'}}}
    Error401:
      description: Missing, invalid, expired or fenced Run Token.
      headers:
        WWW-Authenticate:
          required: true
          schema: {type: string, pattern: '^Bearer(?: [A-Za-z][A-Za-z0-9_-]*="[ -!#-~]*")*$'}
      content: {application/json: {schema: {$ref: '#/components/schemas/AROPError'}}}
    Error404:
      description: Token-bound Run Attempt is not present.
      content: {application/json: {schema: {$ref: '#/components/schemas/AROPError'}}}
    Error409:
      description: Idempotency, state-version, fencing or effect uncertainty conflict.
      content: {application/json: {schema: {$ref: '#/components/schemas/AROPError'}}}
    Error413:
      description: Request body exceeds the fixed runtime limit.
      content: {application/json: {schema: {$ref: '#/components/schemas/AROPError'}}}
    Error415:
      description: Only a single application/json Content-Type is accepted.
      content: {application/json: {schema: {$ref: '#/components/schemas/AROPError'}}}
    Error503:
      description: Durable provider dependency unavailable.
      headers:
        Retry-After:
          required: true
          schema: {type: integer, minimum: 1, maximum: 86400}
      content: {application/json: {schema: {$ref: '#/components/schemas/AROPError'}}}

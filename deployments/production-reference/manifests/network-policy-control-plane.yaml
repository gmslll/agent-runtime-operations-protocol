apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: arop-control-plane, namespace: arop-system}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: arop-control-plane}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-system}}}]
      ports: [{protocol: TCP, port: 8080}]
  egress:
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: arop-postgres}}}]
      ports: [{protocol: TCP, port: 5432}]

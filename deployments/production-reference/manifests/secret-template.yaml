apiVersion: v1
kind: Secret
metadata:
  name: arop-runtime-secrets
  namespace: arop-system
type: Opaque
stringData:
  database-dsn: ${AROP_DATABASE_DSN_FROM_SECRET_MANAGER}
  asset-token-key: ${AROP_ASSET_TOKEN_KEY_FROM_SECRET_MANAGER}
  postgres-password: ${AROP_POSTGRES_PASSWORD_FROM_SECRET_MANAGER}

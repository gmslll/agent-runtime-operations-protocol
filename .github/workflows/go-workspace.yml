name: go-workspace

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  modules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            reference/control-plane/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify the two-module bootstrap
        run: make test-go-workspace

    team: example-team
skills:
  - id: default
    name: First
    invoke_modes: [params]
    input_schema: {type: object}
    output_schema: {type: object}
  - id: default
    name: Second
    invoke_modes: [params]
    input_schema: {type: object}
    output_schema: {type: object}

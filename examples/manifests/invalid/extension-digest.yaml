protocol: arop/v1
kind: AgentManifest
identity:
  id: invalid.extension-digest
  version: 1.0.0
  name: Invalid extension digest
  summary: The declared extension schema digest is intentionally wrong.
  owner: {team: protocol-team}
skills:
  - id: default
    name: Test
    invoke_modes: [params]
    input_schema: {type: object}
    output_schema: {type: object}
execution:
  default_timeout_seconds: 30
  max_timeout_seconds: 60
  effects: {level: none, idempotency: supported, human_confirmation: false}
  capabilities: {}
required_extensions: [com.example.arop.audit.v1]
extensions:
  com.example.arop.audit.v1:
    schema_ref: ./schemas/audit-extension.schema
    schema_digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    data: {policy: standard}

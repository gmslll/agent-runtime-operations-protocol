protocol: arop/v1
kind: AgentManifest
identity:
  id: invalid.local-path
  version: 1.0.0
  name: Invalid local path example
  summary: Must fail because local absolute paths are not portable.
  owner:
    team: example-team
skills:
  - id: default
    name: Default
    invoke_modes: [params]
    input_schema:
      $ref: /Users/example/private/input.schema.json
    output_schema: {type: object}
execution:
  default_timeout_seconds: 30
  max_timeout_seconds: 60
  effects:
    level: none
    idempotency: supported
    human_confirmation: false
  capabilities: {}

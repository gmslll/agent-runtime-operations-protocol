protocol: arop/v1
kind: AgentManifest
identity:
  id: invalid.nested-ref-whitespace
  version: 1.0.0
  name: Invalid nested schema reference whitespace
  summary: Nested package schema references also use visible ASCII without whitespace.
  owner: {team: protocol-team}
skills:
  - id: default
    name: Test
    invoke_modes: [params]
    input_schema: {$ref: ./schemas/nested-whitespace.schema}
    output_schema: {type: object}
execution:
  default_timeout_seconds: 30
  max_timeout_seconds: 60
  effects: {level: none, idempotency: supported, human_confirmation: false}
  capabilities: {}

protocol: arop/v1
kind: AgentManifest
identity:
  id: invalid.schema-ref-whitespace
  version: 1.0.0
  name: Invalid schema reference whitespace
  summary: Package schema references use visible ASCII without whitespace.
  owner: {team: protocol-team}
skills:
  - id: default
    name: Test
    invoke_modes: [params]
    input_schema: {$ref: "./schemas/root schema"}
    output_schema: {type: object}
execution:
  default_timeout_seconds: 30
  max_timeout_seconds: 60
  effects: {level: none, idempotency: supported, human_confirmation: false}
  capabilities: {}

protocol: arop/v1
kind: AgentManifest
identity:
  id: invalid.secret
  version: 1.0.0
  name: Invalid secret example
  summary: Must fail because credential values do not belong in a Manifest.
  owner:
    team: example-team
skills:
  - id: default
    name: Default
    invoke_modes: [params]
    input_schema: {type: object}
    output_schema: {type: object}
execution:
  default_timeout_seconds: 30
  max_timeout_seconds: 60
  effects:
    level: none
    idempotency: supported
    human_confirmation: false
  capabilities: {}
api_key: example-do-not-use

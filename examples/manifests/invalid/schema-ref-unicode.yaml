protocol: arop/v1
kind: AgentManifest
identity:
  id: invalid.schema-ref-unicode
  version: 1.0.0
  name: Invalid Unicode schema reference
  summary: Package schema references use visible ASCII rather than raw Unicode paths.
  owner: {team: protocol-team}
skills:
  - id: default
    name: Test
    invoke_modes: [params]
    input_schema: {$ref: ./schemas/wrapper-unicode.schema}
    output_schema: {type: object}
execution:
  default_timeout_seconds: 30
  max_timeout_seconds: 60
  effects: {level: none, idempotency: supported, human_confirmation: false}
  capabilities: {}
